<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THUNDERS DATA | 川崎ブレイブサンダース</title><style>
:root{--wine:#791d35;--gold:#c5a473;--ink:#251f25;--muted:#746a70;--line:#e7dfe3;--bg:#f7f4f5}*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;color:var(--ink);background:var(--bg)}header{background:var(--wine);color:white;padding:26px max(18px,calc((100% - 1100px)/2));border-bottom:4px solid var(--gold)}header h1{font-size:clamp(25px,5vw,42px);margin:7px 0;letter-spacing:.05em}header a{color:white}small,.muted{color:var(--muted)}header small{color:#eddae0}main{max-width:1100px;margin:auto;padding:20px 14px 40px}h2{font-size:20px;margin:0 0 15px}h3{font-size:16px;margin:18px 0 8px}section{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:15px}button,select{font:inherit;padding:9px 12px;border:1px solid var(--line);background:white;border-radius:7px;color:inherit}button{cursor:pointer}button.active{background:var(--wine);color:white}nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.metric{background:var(--bg);padding:12px;border-radius:8px}.metric b{display:block;font-size:25px;margin-top:5px;font-variant-numeric:tabular-nums}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-variant-numeric:tabular-nums}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--muted);font-size:12px}th:first-child,td:first-child{text-align:left}th button{font:inherit;border:0;padding:0;color:inherit}a{color:var(--wine)}.win{color:#14724c}.loss{color:#a23142}.score{font-size:34px;font-weight:750;margin:8px 0}.notice{background:#fff5df;border:1px solid #e6c98c;padding:12px;border-radius:8px;margin:12px 0}.track{height:23px;background:repeating-linear-gradient(to right,#f2edf0 0,#f2edf0 calc(25% - 1px),#ccc calc(25% - 1px),#ccc 25%);position:relative;border-radius:4px;min-width:360px}.track i{position:absolute;height:100%;background:var(--wine);border-radius:2px;opacity:.85}.rot{display:grid;grid-template-columns:130px minmax(360px,1fr) 58px;gap:8px;align-items:center;margin:6px 0;font-size:12px;white-space:nowrap}svg{display:block;width:100%;height:auto}footer{font-size:12px;color:var(--muted);line-height:1.8}.legend{display:flex;gap:20px;font-size:12px}.swatch{display:inline-block;width:12px;height:4px;vertical-align:middle;margin-right:5px}details{margin-top:12px}summary{cursor:pointer}#match{width:100%;max-width:460px}.num{font-variant-numeric:tabular-nums}.subhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px} [hidden]{display:none!important}
</style></head><body><header><small>2026–27 B.PREMIER / 非公式ファンサイト</small><h1>THUNDERS DATA</h1><div>川崎ブレイブサンダース｜試合・ローテーション分析</div><p><a href="../">FULLCOURT DATA に戻る</a></p></header><main>
<div id="status" class="muted" role="status">公式データの同期状況を確認中…</div><nav><button data-tab="games" class="active">試合一覧</button><button data-tab="detail">試合詳細</button><button data-tab="season">シーズン集計</button></nav>
<div id="games"></div><div id="detail" hidden><section><label for="match">試合を選択</label><br><select id="match"></select><div id="matchbody"></div></section></div><div id="season" hidden></div><footer>出典：<a href="https://www.bleague.jp/">B.LEAGUE公式サイト</a> 公開試合データ（sportsdataverse経由）。得点推移はイベント順で復元。5人の組み合わせは公式ボックススコアの出場時間・+/−との照合に合格した試合のみ掲載します。データ取得に失敗した試合は推測しません。</footer></main>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),pm=n=>n>0?'+'+n:String(n),metric=(label,v)=>'<div class="metric"><small>'+label+'</small><b>'+v+'</b></div>',table=(heads,rows)=>'<div class="scroll"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
let games=[],selected='',mode='score';
function tab(id){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));for(const x of ['games','detail','season'])$(x).hidden=x!==id;}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function summary(gs){let w=gs.filter(g=>g.score[0]>g.score[1]).length,n=gs.length;return '<div class="stats">'+metric('試合',n)+metric('勝敗',w+'–'+(n-w))+metric('平均得点',n?(gs.reduce((a,g)=>a+g.score[0],0)/n).toFixed(1):'—')+metric('平均失点',n?(gs.reduce((a,g)=>a+g.score[1],0)/n).toFixed(1):'—')+'</div>'}
function rows(gs){return table(['日付・対戦相手','H/A','結果','速報分析'],gs.map(g=>['<button data-game="'+esc(g.id)+'">'+esc(g.date)+'　'+esc(g.opponent)+'</button>',g.home?'HOME':'AWAY','<b class="'+(g.score[0]>g.score[1]?'win':'loss')+'">'+g.score.join(' – ')+'</b>',g.lineupVerified?'照合済':'要確認']))}
function drawGames(){ $('games').innerHTML='<section><h2>川崎 シーズン成績</h2>'+summary(games)+'</section><section><h2>試合一覧</h2>'+(!games.length?'<p>公式速報の初回同期待ちです。</p>':rows(games))+'</section>';document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{selected=b.dataset.game;$('match').value=selected;detail();tab('detail')})}
function chart(g){let isDiff=mode==='diff',values=g.points.flatMap(p=>isDiff?[p.for-p.against]:[p.for,p.against]),min=isDiff?Math.min(-5,...values):0,max=Math.max(isDiff?5:10,...values),x=t=>46+690*t/g.duration,y=v=>18+220*(max-v)/(max-min);let path=fn=>g.points.map((p,i)=>{if(!i)return 'M'+x(p.t)+' '+y(fn(p));return 'H'+x(p.t)+' V'+y(fn(p))}).join(' ');let lines='';for(let i=0;i<=4;i++){let v=min+(max-min)*i/4;lines+='<line x1="46" x2="736" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#e7dfe3"/><text x="38" y="'+(y(v)+4)+'" text-anchor="end" font-size="11">'+Math.round(v)+'</text>'}for(let t=0;t<=g.duration;t+=300){lines+='<line x1="'+x(t)+'" x2="'+x(t)+'" y1="18" y2="238" stroke="#eee"/><text x="'+x(t)+'" y="255" text-anchor="middle" font-size="10">'+t/60+'</text>'}return '<svg viewBox="0 0 760 266" role="img" aria-label="得点推移">'+lines+'<path d="'+path(p=>isDiff?p.for-p.against:p.for)+'" fill="none" stroke="#791d35" stroke-width="2.8"/>'+(isDiff?'':'<path d="'+path(p=>p.against)+'" fill="none" stroke="#697682" stroke-width="2.5"/>')+'</svg><div class="legend"><span><i class="swatch" style="background:#791d35"></i>'+(isDiff?'川崎の点差':'川崎')+'</span>'+(isDiff?'':'<span><i class="swatch" style="background:#697682"></i>相手</span>')+'</div>'}
function lineupTable(ls,names){return table(['5人の組み合わせ','出場時間','得点','失点','+/−'],ls.slice().sort((a,b)=>b.seconds-a.seconds).map(l=>[l.players.map(p=>esc(names[p]||p)).join(' / '),fmt(l.seconds),l.for,l.against,pm(l.for-l.against)]))}
function detail(){let g=games.find(g=>g.id===selected);if(!g){$('matchbody').innerHTML='<p>同期済み試合はありません。</p>';return}let names=Object.fromEntries(g.players.map(p=>[p.id,'#'+p.no+' '+p.name]));let diff=g.points.map(p=>p.for-p.against),html='<h3>'+esc(g.date)+'　vs '+esc(g.opponent)+'　'+(g.home?'HOME':'AWAY')+'</h3><div class="score">'+g.score.join(' – ')+'</div><a href="'+esc(g.source)+'" target="_blank" rel="noopener">公式テキスト速報 ↗</a><h3>得点推移</h3><nav><button id="scoreMode" class="'+(mode==='score'?'active':'')+'">得点</button><button id="diffMode" class="'+(mode==='diff'?'active':'')+'">点差</button></nav>'+chart(g)+'<div class="stats">'+metric('最大リード',Math.max(0,...diff))+metric('最大ビハインド',Math.min(0,...diff))+'</div>';
if(g.warnings.some(w=>/Clock correction|invalid event clock|Playing event outside/.test(w)))html+='<p class="notice">公式速報に時刻の不整合があるため、得点推移の一部の時刻は参考表示です。最終得点は公式記録と照合済みです。</p>';html+='<h3>ローテーション</h3>';if(g.lineupVerified){html+='<div class="scroll"><div class="rot"><span>選手</span><span>試合開始 → 終了</span><span>時間</span></div>'+g.players.filter(p=>p.boxSeconds>0).sort((a,b)=>b.boxSeconds-a.boxSeconds).map(p=>'<div class="rot"><span>'+esc(names[p.id])+'</span><div class="track">'+g.segments.filter(s=>s.players.includes(p.id)&&s.end>s.start).map(s=>'<i style="left:'+100*s.start/g.duration+'%;width:'+100*(s.end-s.start)/g.duration+'%" title="'+fmt(s.start)+'–'+fmt(s.end)+'"></i>').join('')+'</div><span>'+fmt(p.boxSeconds)+'</span></div>').join('')+'</div><h3>5人のラインアップ</h3>'+lineupTable(g.lineups,names)}else{html+='<div class="notice">交代情報を公式ボックススコアと照合できなかったため、ローテーションとラインアップは非表示です。<details><summary>照合結果</summary>'+g.warnings.map(esc).join('<br>')+'</details></div>'}
html+='<h3>公式ボックススコア（出場時間・+/−）</h3>'+table(['選手','出場時間','+/−'],g.players.filter(p=>p.boxSeconds>0).map(p=>[esc(names[p.id]),fmt(p.boxSeconds),p.boxPlusMinus==null?'—':pm(p.boxPlusMinus)]))+'<details><summary>選手交代ログ（公式イベント）</summary>'+table(['Q','残り時間','選手','交代'],g.changes.map(c=>[c.period,esc(c.clock),esc(names[c.player]||c.player),c.action===86?'IN':c.action===87?'OUT':'→ '+esc(names[c.player2]||c.player2)]))+'</details>';$('matchbody').innerHTML=html;$('scoreMode').onclick=()=>{mode='score';detail()};$('diffMode').onclick=()=>{mode='diff';detail()}}
function season(){let names={},map=new Map(),valid=games.filter(g=>g.lineupVerified);for(const g of valid){for(const p of g.players)names[p.id]='#'+p.no+' '+p.name;for(const l of g.lineups){let k=l.players.join(','),v=map.get(k)||{players:l.players,seconds:0,for:0,against:0};for(const f of ['seconds','for','against'])v[f]+=l[f];map.set(k,v)}}$('season').innerHTML='<section><h2>全試合</h2>'+summary(games)+'<h3>ホーム</h3>'+summary(games.filter(g=>g.home))+'<h3>アウェー</h3>'+summary(games.filter(g=>!g.home))+'</section><section><h2>シーズン ラインアップ集計</h2><p class="muted">公式記録との照合済み：'+valid.length+' / '+games.length+'試合</p>'+(valid.length?lineupTable([...map.values()],names):'<p>照合済みの試合がありません。</p>')+'</section>'}
$('match').onchange=()=>{selected=$('match').value;detail()};
fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('未同期');return r.json()}).then(d=>{games=d.games||[];$('status').textContent='同期済み '+games.length+'試合 / 更新 '+(d.updated?new Date(d.updated).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'未実行')+(d.errors?.length?' / 取得エラー '+d.errors.length+'件':'');if(d.errors?.length){let details=document.createElement('details'),s=document.createElement('summary');s.textContent='取得エラー詳細';details.append(s);let p=document.createElement('p');p.textContent=d.errors.join(' | ');details.append(p);$('status').after(details)}$('match').innerHTML=games.map(g=>'<option value="'+esc(g.id)+'">'+esc(g.date)+' vs '+esc(g.opponent)+' '+g.score.join('–')+'</option>').join('');selected=games[0]?.id||'';drawGames();detail();season()}).catch(()=>{$('status').textContent='公式速報データの初回同期が完了していません。';drawGames();detail();season()});
</script></body></html>
