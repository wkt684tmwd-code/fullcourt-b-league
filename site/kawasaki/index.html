function detail(){let g=games.find(g=>g.id===selected);if(!g){$('matchbody').innerHTML='<p>同期済み試合はありません。</p>';return}let names=Object.fromEntries(g.players.map(p=>[p.id,'#'+p.no+' '+p.name]));let diff=g.points.map(p=>p.for-p.against),html='<h3>'+esc(g.date)+'　vs '+esc(g.opponent)+'　'+(g.home?'HOME':'AWAY')+'</h3><div class="score">'+g.score.join(' – ')+'</div><a href="'+esc(g.source)+'" target="_blank" rel="noopener">公式テキスト速報 ↗</a><h3>得点推移</h3><nav><button id="scoreMode" class="'+(mode==='score'?'active':'')+'">得点</button><button id="diffMode" class="'+(mode==='diff'?'active':'')+'">点差</button></nav>'+chart(g)+'<div class="stats">'+metric('最大リード',Math.max(0,...diff))+metric('最大ビハインド',Math.min(0,...diff))+'</div>';

html+='<h3>公式ボックススコア（出場時間・+/−）</h3>'+table(['選手','出場時間','+/−'],g.players.filter(p=>p.boxSeconds>0).map(p=>[esc(names[p.id]),fmt(p.boxSeconds),p.boxPlusMinus==null?'—':pm(p.boxPlusMinus)]))+'<details><summary>選手交代ログ（公式イベント）</summary>'+table(['Q','残り時間','選手','交代'],g.changes.map(c=>[c.period,esc(c.clock),esc(names[c.player]||c.player),c.action===86?'IN':c.action===87?'OUT':'→ '+esc(names[c.player2]||c.player2)]))+'</details>';$('matchbody').innerHTML=html;$('scoreMode').onclick=()=>{mode='score';detail()};$('diffMode').onclick=()=>{mode='diff';detail()}}
function season(){let names={},map=new Map(),valid=games.filter(g=>g.lineupVerified);for(const g of valid){for(const p of g.players)names[p.id]='#'+p.no+' '+p.name;for(const l of g.lineups){let k=l.players.join(','),v=map.get(k)||{players:l.players,seconds:0,for:0,against:0};for(const f of ['seconds','for','against'])v[f]+=l[f];map.set(k,v)}}$('season').innerHTML='<section><h2>全試合</h2>'+summary(games)+'<h3>ホーム</h3>'+summary(games.filter(g=>g.home))+'<h3>アウェー</h3>'+summary(games.filter(g=>!g.home))+'</section><section><h2>シーズン ラインアップ集計</h2><p class="muted">公式記録との照合済み：'+valid.length+' / '+games.length+'試合</p>'+(valid.length?lineupTable([...map.values()],names):'<p>照合済みの試合がありません。</p>')+'</section>'}

<script>
const league=window.BLEAGUE_DATA||{}, allGames=Array.isArray(league.games)?league.games:[], leagueTeams=Array.isArray(league.teams)?league.teams:[], leaguePlayers=Array.isArray(league.players)?league.players:[];
const keys={points:'得点',reb:'REB',reb_off:'ORB',reb_def:'DRB',assists:'AST',steals:'STL',blocks:'BLK',turnovers:'TO',fouls:'PF',fg2_made:'2PM',fg2_attempted:'2PA',fg3_made:'3PM',fg3_attempted:'3PA',ft_made:'FTM',ft_attempted:'FTA',efficiency:'EFF',plus_minus:'+/-',second_chance_points:'セカンドチャンス得点',paint_points:'ペイント得点',fast_break_points:'速攻得点',points_off_turnover:'TOからの得点',fgPct:'FG%',p2:'2P%',p3:'3P%',ftPct:'FT%',efg:'eFG%',ts:'TS%',ortg:'ORtg (推定)',drtg:'DRtg (推定)',net:'NetRtg (推定)',orbPct:'ORB%',drbPct:'DRB%',pace:'PACE (推定)',min:'MIN',gp:'出場試合'};
const validNum=v=>typeof v==='number'&&Number.isFinite(v), num=v=>validNum(v)?v.toFixed(1):'—', ratio=(a,b)=>validNum(a)&&validNum(b)&&b>0?a/b:null, pct=(a,b)=>{let r=ratio(a,b);return r===null?null:r*100}, add=(a,b)=>validNum(a)&&validNum(b)?a+b:null;
const ownTeam=t=>String(t||'').includes('川崎'), teamId=(g)=>ownTeam(g.homeName)?g.homeId:g.awayId, oppId=(g)=>ownTeam(g.homeName)?g.awayId:g.homeId, byId=new Map(allGames.map(g=>[String(g.id),g])), kg=allGames.filter(g=>ownTeam(g.homeName)||ownTeam(g.awayName)), leagueK=leagueTeams.find(t=>ownTeam(t.name));
function mval(s,k,div=1){if(!s||!div)return null;const a=s.fg2_made,b=s.fg3_made,c=s.fg2_attempted,d=s.fg3_attempted,fgm=add(a,b),fga=add(c,d),fta=s.ft_attempted;let v;switch(k){case'fgPct':return pct(fgm,fga);case'p2':return pct(a,c);case'p3':return pct(b,d);case'ftPct':return pct(s.ft_made,fta);case'efg':return pct(validNum(fgm)&&validNum(b)?fgm+.5*b:null,fga);case'ts':return pct(s.points,validNum(fga)&&validNum(fta)?2*(fga+.44*fta):null);case'ortg':return pct(s.points,s.team_possessions);case'drtg':return pct(s.opp_points,s.opp_possessions);case'net':{let o=mval(s,'ortg'),d=mval(s,'drtg');return validNum(o)&&validNum(d)?o-d:null}case'orbPct':return pct(s.reb_off,add(s.reb_off,s.opp_reb_def));case'drbPct':return pct(s.reb_def,add(s.reb_def,s.opp_reb_off));case'pace':v=s.pace_possessions;break;default:v=s[k]}return validNum(v)?v/div:null}
function sums(rows){let out={};if(!rows.length)return out;for(const k of new Set(rows.flatMap(r=>Object.keys(r||{}))))if(rows.every(r=>validNum(r?.[k])))out[k]=rows.reduce((a,r)=>a+r[k],0);return out}
function possession(s){let a=add(s.fg2_attempted,s.fg3_attempted);return [a,s.ft_attempted,s.reb_off,s.turnovers].every(validNum)?a+.44*s.ft_attempted-s.reb_off+s.turnovers:null}
function enriched(g,tid){let s={...g.teamStats?.[tid]},other=tid===g.homeId?g.awayId:g.homeId,o=g.teamStats?.[other]||{};s.opp_points=o.points;s.opp_reb_def=o.reb_def;s.opp_reb_off=o.reb_off;s.team_possessions=possession(s);s.opp_possessions=possession(o);let sec=g.players?.filter(p=>p.teamId===tid&&p.played).reduce((a,p)=>a+p.seconds,0);s.pace_possessions=validNum(s.team_possessions)&&validNum(s.opp_possessions)?(s.team_possessions+s.opp_possessions)/2*40/Math.max(40,(sec||12000)/300):null;return s}

function playersAgg(){let map=new Map();for(const g of games)for(const p of g.players||[]){if(!map.has(p.id))map.set(p.id,{id:p.id,name:p.name,no:p.no,gp:0,gs:0,sec:0,pm:[],logs:[],box:[]});let r=map.get(p.id);if(p.boxSeconds>0){r.gp++;r.gs+=p.starter?1:0;r.sec+=p.boxSeconds;r.pm.push(p.boxPlusMinus);r.logs.push({g,p});let b=byId.get(String(g.id))?.players?.find(x=>String(x.id)===String(p.id)&&x.played&&String(x.teamId)===String(teamId(byId.get(String(g.id)))));if(b)r.box.push(b.stats||{})}}return [...map.values()].map(p=>({...p,stats:sums(p.box),pmAvg:p.pm.length&&p.pm.every(validNum)?p.pm.reduce((a,b)=>a+b,0)/p.pm.length:null}))}
